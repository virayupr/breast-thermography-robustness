name: Verify archived ICVGIP release
on:
  push:
    paths:
      - 'release/**'
      - '.github/workflows/verify-release.yml'
  pull_request:
    paths:
      - 'release/**'
      - '.github/workflows/verify-release.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install aggregate verification dependencies
        run: python -m pip install numpy pandas
      - name: Check archive hashes, notebook outputs, and summary arithmetic
        run: python release/verify_release.py
